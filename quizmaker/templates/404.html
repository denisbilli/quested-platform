{% extends "base_generic.html" %}
{% load static %}

{% block content %}
<div class="login-wrap d-flex align-items-center flex-wrap justify-content-center">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 col-lg-6">
                <img src="{% static 'src/images/404_error.png' %}" alt="403 Forbidden" style="max-width: 100%; height: 80dvh;">
            </div>
            <div class="error-page col-md-6 col-lg-6">
                <div class="login-box bg-white box-shadow border-radius-10" style="max-width: 100% !important;">
                    <div class="error-page-wrap text-center">
                        <h1>403</h1>
                    </div>
                    <div class="login-title">
                        <h2 class="text-center text-primary">Error: 404 Page Not Found</h2>
                    </div>
                    <p class="text-center">Sorry, the page you’re looking for cannot be accessed.<br>Either check the URL</p>
                    <div class="pt-20 mx-auto max-width-200">
                        <a href="{% url 'photobiz-index' %}" class="btn btn-primary btn-block btn-lg">Back To Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
