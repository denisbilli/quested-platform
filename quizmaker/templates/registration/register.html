{% extends 'registration/base_register.html' %}

{% load static %}
{% block content %}

<div class="row align-items-center">
    <div class="col-md-6 col-lg-7">
        <img src="{% static 'src/images/quested_room.png' %}" alt="">
    </div>
    <div class="col-md-6 col-lg-5">
        <div class="register-box bg-white box-shadow border-radius-10">
            <div class="wizard-content">
                <form class="tab-wizard-user wizard-circle wizard" method="POST" action="{% url 'register' %}">
                    {% csrf_token %}
                    <h5>New User Registration</h5>
                    <section>
                        <div class="form-wrap max-width-600 mx-auto">
                            <!-- Name and Surname -->
                            <div class="form-group row">
                                <label class="col-sm-4 col-form-label">Name*</label>
                                <div class="col-sm-8">
                                    <input type="text" name="name" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-4 col-form-label">Surname*</label>
                                <div class="col-sm-8">
                                    <input type="text" name="surname" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-4 col-form-label">Email*</label>
                                <div class="col-sm-8">
                                    <input type="email" name="email" class="form-control" required>
                                </div>
                            </div>
                            <!-- Username and Password -->
                            <div class="form-group row">
                                <label class="col-sm-4 col-form-label">Username*</label>
                                <div class="col-sm-8">
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-4 col-form-label">Password*</label>
                                <div class="col-sm-8">
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-4 col-form-label">Confirm Password*</label>
                                <div class="col-sm-8">
                                    <input type="password" name="cnf_password" class="form-control" required>
                                </div>
                            </div>
                            <!-- Additional Info (Optional) -->
                            <!-- Other fields like Date of Birth, Gender, City etc. can be added here -->
                        </div>
                    </section>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<!-- switchery js -->
<script src="{% static 'src/plugins/switchery/switchery.min.js' %}"></script>
<!-- bootstrap-tagsinput js -->
<script src="{% static 'src/plugins/bootstrap-tagsinput/bootstrap-tagsinput.js' %}"></script>
<!-- bootstrap-touchspin js -->
<script src="{% static 'src/plugins/bootstrap-touchspin/jquery.bootstrap-touchspin.js' %}"></script>
<script src="{% static 'vendors/scripts/advanced-components.js' %}"></script>
{% endblock %}
